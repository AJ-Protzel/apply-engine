name: ingest

# The nightly schedule is gone on purpose.
#
# This ran at 04:30 America/Los_Angeles against a Supabase project that no
# longer exists. A cron pointed at a dead database does not fail quietly -- it
# fails every morning, forever, and turns the Actions tab into a wall of red for
# anyone who came to read the code. Dropping the schedule and keeping the job
# dispatchable is the honest state: the pipeline still runs for anyone who
# supplies their own SUPABASE_* secrets, and nothing pretends to be running when
# it is not.
#
# The schedule was `cron: "30 11 * * *"` -- 04:30 PDT, drifting an hour when
# Pacific went to standard time, which the 06:45 scoring pass had room to absorb.
on:
  workflow_dispatch:
  # Tests run on every push; the ingest job below is gated so a push never
  # triggers a real run against a database.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: apply-engine-ingest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
