name: ingest

# 04:30 America/Los_Angeles. Cron is fixed UTC, so this is PDT; it drifts an
# hour when Pacific goes to standard time in November. The scoring pass runs
# more than two hours later, which leaves plenty of room either way.
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
  # Tests run on every push; the ingest job below is gated so a push never
  # triggers a real run against the database.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: apply-engine-ingest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
