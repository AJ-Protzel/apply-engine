# ---------------------------------------------------------------------------
# companies.yaml -- employers polled every night, one row per ATS board.
#
# Target size is 150-250 employers. This file is the seed; it grows as slugs
# get confirmed.
#
# RULE: nothing lands here unvalidated. A wrong slug fails as an empty board,
# not as an error, so it looks exactly like a company with no openings and can
# sit here for months quietly contributing nothing. Confirm first:
#
#     python -m apply_engine.find_slug "Blue Shield of California"
#     python -m apply_engine.find_slug --slug blueshieldca
#
# Only a board that returns postings confirms a slug.
#
# tier: 1 = poll first / highest interest, 2 = normal, 3 = long tail.
# The `companies` table is the runtime source of truth; this file seeds it.
# ---------------------------------------------------------------------------

companies: []

